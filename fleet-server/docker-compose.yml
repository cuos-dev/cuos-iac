# Fleet Server — one container, one volume. History and logs live in a SQLite database in /data.
#
#   docker compose up -d --build
#
# Run it behind TLS (a reverse proxy): device tokens travel in the Authorization header.
# Agent system.json entries to point at it (replace <host> with your server name):
#   "fleet_server_url": "https://<host>"
#   "fleet_secret":     "<the FLEET_SECRET below>"

services:
  fleet-server:
    build: .
    ports:
      - "${FLEET_PORT:-8085}:8085"
    environment:
      FLEET_SECRET:     ${FLEET_SECRET:-dev-fleet-secret}
      FLEET_ENROLLMENT: ${FLEET_ENROLLMENT:-auto}
      FLEET_ADMIN_USER: ${FLEET_ADMIN_USER:-admin}
      FLEET_ADMIN_PASS: ${FLEET_ADMIN_PASS:-admin}
      FLEET_WEBHOOK_URL:    ${FLEET_WEBHOOK_URL:-}
      FLEET_WEBHOOK_EVENTS: ${FLEET_WEBHOOK_EVENTS:-}
      FLEET_RETENTION_DAYS:     ${FLEET_RETENTION_DAYS:-30}
      FLEET_LOG_RETENTION_DAYS: ${FLEET_LOG_RETENTION_DAYS:-7}
    volumes:
      - fleet-data:/data
    restart: unless-stopped

volumes:
  fleet-data:
